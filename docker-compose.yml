services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qrchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrchat}
      POSTGRES_DB: qrchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrchat -d qrchat"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://qrchat:${POSTGRES_PASSWORD:-qrchat}@db:5432/qrchat?sslmode=disable
      # Set a real secret in .env for anything beyond local testing.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      # Empty: invite links use the origin the host opened the app on.
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
