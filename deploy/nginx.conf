# One origin for everything: the web app, the REST API under /api and the
# WebSocket at /ws. Put TLS in front of this (or add a listen 443 block) in
# production so browsers use HTTPS/WSS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api {
  server api:8080;
}

upstream web {
  server web:3000;
}

server {
  listen 80;
  client_max_body_size 11m; # images up to 10 MB; the API enforces exact limits

  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # /service/v1 is for trusted backends on the internal network; they call
  # api:8080 directly. Never expose it through the public entry point.
  # Case-insensitive: /API/service/... would otherwise reach the web app,
  # whose /api rewrite matches regardless of case.
  location ~* ^/api/service(/|$) {
    return 404;
  }

  # /api/rooms -> api:8080/rooms
  location /api/ {
    proxy_pass http://api/;
  }

  location = /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $http_host;
    proxy_read_timeout 75s; # above the server's 60 s ping timeout
    proxy_send_timeout 75s;
  }

  location / {
    proxy_pass http://web;
  }
}
